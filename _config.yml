title: OfferDesk
email: info@offerdesk.com
description: >-
  OfferDesk is voor vakbedrijven die werk aannemen op offerte: je ziet wat je aan een klus
  overhoudt, de klant zegt ja op zijn telefoon en je bestellijst staat klaar.
default_lang: nl
# jekyll-seo-tag: Open Graph locale, the share image and a large Twitter card for every page (a post's own image wins)
locale: nl_NL
twitter:
  username: offerdesk
  card: summary_large_image
google_analytics_id: G-XMLKF7JVEX
mailerlite:
  action: "https://assets.mailerlite.com/jsonp/2670655/forms/199973805230130365/subscribe"
baseurl: ""
url: "https://offerdesk.nl"

# GitHub Pages safe plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Build settings
theme: minima
markdown: kramdown
exclude:
  - node_modules
  - resources
  - package.json
  - package-lock.json
  - README.md
  - .gitignore
  - .prettierrc
  - Gemfile
  - Gemfile.lock
source: docs

# Blog: articles live in docs/_posts. A post dated in the future stays out of the site until that day;
# the Pages workflow builds daily, so a post written ahead appears on its date by itself.
future: false
feed:
  path: blog/feed.xml
defaults:
  - scope:
      path: ""
    values:
      image: /images/og-image.jpg
  - scope:
      path: "en"
    values:
      image: /images/og-image-en.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: nl
      permalink: /blog/:title/
