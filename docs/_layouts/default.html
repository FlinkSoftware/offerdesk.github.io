<!DOCTYPE html>
<html lang="nl" class="h-full bg-white">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    {% seo %}
    <link rel="stylesheet" href="{{ '/css/app.css' | relative_url }}">
</head>

<body class="h-full text-text antialiased">
    <div class="bg-white">
        <header class="absolute inset-x-0 top-0 z-50">
            {% include components/top-panel.html %}
            {% include components/navigation.html %}
        </header>
        <main>
            {{ content }}
        </main>
        <footer class="bg-white border-t border-gray-100">
            <div class="mx-auto max-w-7xl px-6 py-8 text-sm text-gray-500 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }} — Van offerte tot uitvoering.</p>
                <a href="mailto:{{ site.email }}" class="font-semibold text-primary hover:underline">{{ site.email }}</a>
            </div>
        </footer>
    </div>
    <script src="https://unpkg.com/typewriter-effect@2.22.0/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
    <script src="{{ '/js/app.js' | relative_url }}"></script>
</body>

</html>
