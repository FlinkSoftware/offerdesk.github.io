<!-- Newsletter / Features Promo -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="newsletter-section" class="bg-dark-blue py-12 sm:py-16 lg:py-24">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row items-center justify-between gap-8 lg:gap-12">
            <div class="lg:max-w-xl">
                <h2 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight !text-white text-pretty">
                    {{ i18n.newsletter.title }}
                </h2>
                <p class="mt-3 sm:mt-4 text-base sm:text-lg text-gray-300">{{ i18n.newsletter.intro }}</p>
            </div>
            <div class="w-full lg:max-w-md">
                <!-- MailerLite Form Embed -->
                <div class="ml-embedded" data-form="lB1Awv"></div>
            </div>
        </div>
    </div>
</div>
