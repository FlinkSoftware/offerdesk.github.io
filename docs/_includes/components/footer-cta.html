<!-- Footer CTA -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="footer-cta" class="bg-white py-12 sm:py-20 lg:py-30">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div
            class="bg-gradient-to-br from-primary to-primary/90 rounded-3xl p-8 sm:p-12 lg:p-16 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-32 -left-32 h-80 w-80 bg-white/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-32 -right-32 h-80 w-80 bg-secondary/10 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <h2 class="heading-2 text-white">{{ i18n.footer_cta.title_prefix }} <span class="text-white/90">{{ i18n.footer_cta.title_highlight }}</span></h2>
                <p class="mt-6 body-large text-white/90 max-w-2xl mx-auto">{{ i18n.footer_cta.intro }}</p>

                <div class="mt-10 sm:mt-12 flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <a href="https://app.offerdesk.nl/sign-up"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="button-primary rounded-lg bg-white text-primary px-8 py-3.5 font-semibold hover:bg-gray-100 transition-colors shadow-lg">
                        {{ i18n.nav.sign_up }}
                    </a>
                </div>

                <div class="mt-8 text-white/60 text-sm">
                    <p>{{ i18n.footer_cta.questions }} <a href="mailto:{{ site.email }}" class="font-semibold text-white/90 hover:text-white">{{ site.email }}</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
