<!-- Footer CTA -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="footer-cta" class="bg-white py-12 sm:py-20 lg:py-30">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div
            class="bg-gradient-to-br from-primary to-primary/90 rounded-3xl p-8 sm:p-12 lg:p-16 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-32 -left-32 h-80 w-80 bg-white/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-32 -right-32 h-80 w-80 bg-secondary/10 rounded-full blur-3xl"></div>

            <div class="relative z-10">
                <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold text-white">{{ i18n.footer_cta.title_prefix }} <span class="text-white/90">{{ i18n.footer_cta.title_highlight }}</span></h2>
                <p class="mt-6 text-base sm:text-lg text-white/90 max-w-2xl mx-auto">{{ i18n.footer_cta.intro }}</p>

                <div class="mt-10 sm:mt-12 max-w-2xl mx-auto">
                    <p class="text-white/80 text-sm sm:text-base mb-6">Stuur je idee of suggestie naar:</p>
                    <div class="bg-white/10 backdrop-blur-md rounded-xl p-6 sm:p-8 border border-white/20">
                        <p class="text-white/90 text-lg sm:text-xl font-semibold break-all">info<span class="text-white/60">@</span>offerdesk<span class="text-white/60">.</span>com</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
