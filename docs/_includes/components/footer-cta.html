<!-- Footer CTA -->
<div id="footer-cta" class="bg-dark-blue py-24">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div
            class="bg-[#1e3a5a] rounded-3xl p-12 text-center shadow-2xl border border-white/10 relative overflow-hidden">
            <div class="absolute -top-24 -left-24 h-64 w-64 bg-primary/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -right-24 h-64 w-64 bg-secondary/20 rounded-full blur-3xl"></div>

            <h2 class="text-3xl font-bold !text-white sm:text-4xl">Heeft u nog <span class="text-tertiary">ideeën of
                    suggesties?</span></h2>
            <p class="mt-4 text-lg text-gray-300">Laat het ons weten — wie weet zie je jouw idee terug in OfferDesk.
            </p>

            <form id="suggestion-form" class="mt-10 max-w-2xl mx-auto" action="mailto:info@offerdesk.com" method="post" enctype="text/plain">
                <label for="suggestion-message" class="sr-only">Bericht</label>
                <textarea id="suggestion-message" name="bericht" rows="4" required
                    class="w-full rounded-2xl bg-white/10 border border-white/20 p-4 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-tertiary"
                    placeholder="Typ hier je bericht..."></textarea>
                <p id="suggestion-success" class="mt-4 hidden text-tertiary font-semibold">Bedankt, we hebben je bericht ontvangen.</p>
                <button type="submit"
                    class="mt-6 rounded-full bg-tertiary px-10 py-4 font-bold text-dark-blue shadow-lg hover:bg-white transition-all">
                    Verstuur je vraag, idee of suggestie
                </button>
            </form>
        </div>
    </div>
</div>
