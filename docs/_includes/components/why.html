<!-- Why Section -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="why-section" class="bg-gradient-to-br from-gray-50 to-white py-24 sm:py-32 lg:py-40">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="text-center mb-16 sm:mb-20">
            <h2 class="text-3xl font-bold tracking-tight text-dark-blue sm:text-4xl">
                {{ i18n.why.title_prefix }} <span class="text-primary">{{ i18n.why.title_highlight }}</span>
            </h2>
        </div>
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
            {% for card in i18n.why.cards %}
            <div class="flex flex-col items-start p-8 bg-white rounded-2xl border border-border hover:shadow-md transition-shadow">
                <div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary/10 text-primary font-bold text-base mb-5">
                    {{ card.icon }}
                </div>
                <h3 class="text-lg font-bold text-dark-blue mb-3">{{ card.title }}</h3>
                <p class="text-sm text-gray-700 leading-relaxed">{{ card.body }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
