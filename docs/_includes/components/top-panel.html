<!-- Top Banner -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div class="relative isolate flex items-center justify-center gap-x-6 overflow-hidden bg-dark-blue px-6 py-4 sm:px-3.5">
    <div class="flex items-center gap-x-4 gap-y-2 rounded-full px-6 py-2 sm:gap-x-6">
        <p class="text-sm/6 text-white text-center">
            {{ i18n.top_panel.intro }}
            <span class="font-bold text-lg mx-1 text-tertiary">{{ i18n.top_panel.discount }}</span>
            {{ i18n.top_panel.suffix }}
        </p>
        <a href="#newsletter-section"
            class="flex-none rounded-full bg-tertiary px-4 py-1.5 text-sm font-bold text-dark-blue shadow-xs hover:bg-white transition-colors">
            {{ i18n.top_panel.cta }}
        </a>
    </div>
</div>
