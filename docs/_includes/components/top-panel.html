<!-- Top Banner -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div class="relative isolate flex items-center justify-center gap-x-6 overflow-hidden bg-gradient-to-r from-primary to-primary/90 px-6 py-3 sm:px-3.5 sm:py-4">
    <div class="flex items-center gap-x-4 gap-y-2 rounded-full px-6 py-2">
        <p class="text-sm font-medium text-white text-center">
            {{ i18n.top_panel.intro }}
            <span class="font-bold text-base mx-2 text-white/90">{{ i18n.top_panel.discount }}</span>
            {{ i18n.top_panel.suffix }}
        </p>
        <a href="#newsletter-section"
            class="flex-none rounded-lg bg-white px-5 py-2 text-sm font-semibold text-primary shadow-sm hover:bg-gray-100 transition-colors">
            {{ i18n.top_panel.cta }}
        </a>
    </div>
</div>
