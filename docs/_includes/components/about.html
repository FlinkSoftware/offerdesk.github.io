<!-- Wie is OfferDesk -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="about-section" class="bg-white py-16 sm:py-24 lg:py-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row items-center gap-8 sm:gap-12 lg:gap-16">
            <div class="lg:w-1/2">
                <h2 class="text-3xl sm:text-4xl lg:text-4xl font-bold text-dark-blue">{{ i18n.about.title_prefix }} <span class="text-primary">{{ i18n.about.title_highlight }}</span></h2>
                <div class="mt-6 sm:mt-8 space-y-4 sm:space-y-6 text-base sm:text-lg text-dark-blue font-medium leading-relaxed">
                    {% for paragraph in i18n.about.paragraphs %}
                    <p>{{ paragraph }}</p>
                    {% endfor %}
                </div>
            </div>
            <div class="lg:w-1/2 relative w-full">
                <div class="absolute -inset-x-10 -inset-y-10 -z-10 opacity-20 hidden sm:block">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="h-full w-full">
                        <path fill="#0068ff"
                            d="M47.7,-63.9C61.4,-56.3,71.8,-42.6,76.5,-27.4C81.2,-12.3,80.1,4.3,74.5,19.2C68.9,34.1,58.8,47.3,45.8,56.5C32.8,65.7,16.4,70.9,0.3,70.5C-15.8,70.1,-31.6,64.2,-44.7,54.6C-57.8,45,-68.2,31.7,-72.2,16.2C-76.2,0.7,-73.8,-17,-65.4,-31.2C-57,-45.4,-42.6,-56.1,-27.9,-63.2C-13.2,-70.3,1.8,-73.8,16.8,-70.5C31.8,-67.2,33.9,-71.5,47.7,-63.9Z"
                            transform="translate(100 100)" />
                    </svg>
                </div>
                <img src="https://images.unsplash.com/photo-1581094794329-c8112a89af12?auto=format&fit=crop&w=1200&q=80"
                    alt="{{ i18n.about.image_alt }}" class="rounded-2xl shadow-2xl w-full">
                <div
                    class="absolute bottom-3 sm:bottom-4 left-3 sm:left-4 right-3 sm:right-4 bg-white/90 backdrop-blur rounded-xl p-3 sm:p-4 shadow-lg text-center font-bold text-sm sm:text-base text-dark-blue">
                    {{ i18n.about.caption }}
                </div>
            </div>
        </div>
    </div>
</div>
