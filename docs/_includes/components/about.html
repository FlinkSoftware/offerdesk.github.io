<!-- Wie is OfferDesk -->
{% assign lang = page.lang | default: site.default_lang | default: 'nl' %}
{% assign i18n = site.data.i18n[lang] %}
<div id="about-section" class="bg-white py-16 sm:py-24 lg:py-32">
    <div class="mx-auto max-w-7xl px-6 lg:px-8">
        <div class="flex flex-col lg:flex-row items-center gap-10 lg:gap-16">
            <div class="lg:w-1/2">
                <h2 class="text-3xl sm:text-4xl font-bold text-dark-blue mb-6 sm:mb-8">{{ i18n.about.title_prefix }} <span class="text-primary">{{ i18n.about.title_highlight }}</span></h2>
                <div class="space-y-5 text-base sm:text-lg text-gray-700 leading-relaxed">
                    {% for paragraph in i18n.about.paragraphs %}
                    <p>{{ paragraph }}</p>
                    {% endfor %}
                </div>
            </div>
            <div class="lg:w-1/2 w-full">
                <img src="{{ '/images/offerdesk/offerdesk-dashboard.png' | relative_url }}"
                    alt="{{ i18n.about.image_alt }}" class="rounded-2xl shadow-2xl w-full">
                <p class="mt-3 sm:mt-4 text-center font-semibold text-sm sm:text-base text-dark-blue">
                    {{ i18n.about.caption }}
                </p>
            </div>
        </div>
    </div>
</div>
