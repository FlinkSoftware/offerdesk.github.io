  about:
    title_prefix: "Wat is"
    title_highlight: "OfferDesk"
    paragraphs:
      - "OfferDesk is gemaakt voor vakbedrijven die werk aannemen op offerte: van één man met een bus tot een ploeg van vijf."
      - "Veel zit in het hoofd van de baas. Bij welke groothandel je koopt, wat je ervoor betaalt, wat je op een klus wilt overhouden. OfferDesk legt dat vast, zodat iedereen die offertes maakt het ook weet."
      - "Waar we voor staan: je weet wat je aan een klus overhoudt vóórdat je de offerte verstuurt."
    image_alt: "Het overzicht van OfferDesk met openstaande en geaccepteerde offertes en wat je gemiddeld overhoudt"
    caption: "Werk binnenhalen. Voorbereiden. Uitvoeren. Zien wat het opleverde."


