    title_prefix: "Wat is"
    title_highlight: "OfferDesk"
    paragraphs:
      - "OfferDesk is gebouwd voor vakbedrijven die offertes maken op basis van materialen, leveranciers en margecalculaties."
      - "Veel vakkennis zit in het hoofd van de eigenaar. Welke leverancier wordt gebruikt, welke inkoopprijs geldt en hoeveel marge nodig is. OfferDesk zorgt ervoor dat die kennis wordt vastgelegd en beschikbaar blijft voor iedereen die offertes maakt."
      - "Onze visie: elk vakbedrijf moet precies weten wat het verdient voordat een offerte wordt verstuurd."
    image_alt: "Het dashboard van OfferDesk met openstaande en geaccepteerde offertes en de gemiddelde marge"
    caption: "Win werk. Bereid voor. Voer uit. Meet winst."

