  faq:
    title_prefix: "Frequently"
    title_highlight: "asked"
    title_suffix: "questions"
    items:
      - question: "What is OfferDesk, and what is different from ordinary quoting software?"
        answer: "OfferDesk is for trade businesses that take on work by quote: contractors, installers, painters, electricians, landscapers, maintenance. Ordinary quoting software makes a tidy document. What the job costs you and what you keep, you work out somewhere else. OfferDesk does the sums with you: every line shows what you buy for and what you keep. Your wholesalers and prices go in once, and when the customer says yes, your order list is ready."
      - question: "Is OfferDesk a heavy system like SAP or AFAS?"
        answer: "No, and that is on purpose. Those systems run the whole company: bookkeeping, stock, staff. That takes months and consultants. OfferDesk does the part where you make or lose money: what the job costs, what you keep, and what to order when the customer says yes. You start today, pay a fixed amount a month and can stop any month. Your bookkeeping stays where it is."
      - question: "What happens when the customer says yes?"
        answer: "Your order list is ready, per wholesaler, with the quantities and prices from the quote. If you agreed a deposit, the customer gets the payment request right away. And everything after that, who did what, what the customer asked, stays on the quote."
        home: true
      - question: "Where do I start?"
        answer: "Put your materials and your hours in first, with your purchase prices. Then make your first quote: pick lines, change quantities, and you see right away what you keep. Send it online or as PDF. Start with the example data and there is already a customer and a quote to play with."
        home: true
      - question: "Later I forget which wholesaler I wanted to buy from. Does OfferDesk help?"
        answer: "Yes. Every product carries the wholesaler, the item number and your purchase price. Open the quote a month later and you see exactly where you wanted to get it, at what price, and what you keep."
      - question: "How many quotes can I make?"
        answer: "As many as you like, on every plan. Starter is for working on your own, Professional for a business with a few people, Business for a crew. See Pricing."
      - question: "Can I use my own logo?"
        answer: "Yes. Your quotes get your own logo and your own texts, so every quote looks like it comes from your business."
      - question: "Does OfferDesk stop once the quote is out the door?"
        answer: "No. The customer says yes or asks a question, you see it right away. After that OfferDesk helps with the deposit and the order list. Planning, stock and after-the-job figures are coming."
      - question: "Who is OfferDesk for?"
        answer: "For tradespeople who take on work by quote: contractors, heating and heat pump installers, electricians, plumbers, solar panel fitters, painters, plasterers, landscapers, maintenance businesses. From one person with a van to a crew of five."
      - question: "How does my customer see the quote?"
        answer: "They get an email with the PDF and a link with a code. On that page they read the quote, grab the PDF, ask a question and say yes with their name. You get a notification and see it all on the quote. You can look beforehand at what they will see."
        home: true
      - question: "I already have bookkeeping software. Do I keep making my invoices there?"
        answer: "Yes, that is how it is meant. OfferDesk makes quotes, not invoices. If you use Moneybird, you put a quote the customer said yes to into Moneybird as an invoice with one tap. With other software you copy the quote over; Exact Online, SnelStart and e-Boekhouden.nl are coming."
        home: true
      - question: "Does it work with Moneybird?"
        answer: "Yes, on every plan. You connect Moneybird under Settings › Integrations. After that you put a quote the customer said yes to into Moneybird as a draft invoice with one tap, with the customer as contact and the VAT per line. In Moneybird you check it and send it."
      - question: "How do I pay for OfferDesk?"
        answer: "Through Mollie, by iDEAL, credit card or direct debit. You try it free for 14 days first and then choose: pay right away or only after the trial. Cancel any month."
        home: true
      - question: "Can I ask for a deposit?"
        answer: "Yes (Professional and Business). For example the materials on yes and the rest on delivery. OfferDesk works out the materials deposit itself, without your own hours; the customer sees only the amount. A share or a fixed amount works too. The customer gets a payment request with your own bank's, Tikkie's or bunq's payment link; the money goes straight to you. OfferDesk reminds them, you tick off what came in."
        home: true
      - question: "And if I agree something else about paying with a customer?"
        answer: "That works per quote. Your usual split is a starting point: per quote you pick the parts, as a percentage or a fixed amount, due on yes, at the start, on delivery or on a date. The customer sees it beforehand on the quote, and extra work goes on the last payment. Professional and Business."
      - question: "Can I keep photos and papers with a quote?"
        answer: "Yes, on every plan. On the Photos tab you put photos (also straight from your phone), measurements, sketches and PDFs with the quote, with a short note. They are for your own people, unless you make one visible to the customer: then it sits on the quote. Photos are made smaller by themselves, so your space lasts."
        home: true
      - question: "Does my customer see my terms?"
        answer: "Yes. You put your terms as a PDF under Settings › Terms and conditions. Every quote you send gets the version of that moment; the customer reads them on the quote page and ticks that they agree. OfferDesk records which version that was and when. Change them later and old quotes keep their own version. On every plan."
        home: true
      - question: "Can I choose how my quote looks?"
        answer: "Yes. Your quote gets your own logo and your own text above and below the lines. On Professional and Business you choose from three layouts: Classic, Modern and Compact, for everything or per quote."
