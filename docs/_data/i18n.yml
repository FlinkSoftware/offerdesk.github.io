  process:
    title_prefix: "Van offerte tot betaling"
    title_highlight: "zonder gedoe"
    body: "Met OfferDesk maak je niet alleen de offerte. Je ziet ook wat je eraan verdient, wat je moet bestellen en wanneer de klant betaalt. Alles blijft bij elkaar, van de eerste vraag van de klant tot het geld op je rekening."
    steps:
      - "Offerte maken"
      - "Klant zegt ja"
      - "Bestellen en aan de slag"
      - "Geld binnen"
    cards:
      problem:
        title: "Vier weken later is de klant akkoord…"
        body: "Mooi. Maar dan begint het zoeken. Bij welke groothandel zat je? Wat zou je eraan verdienen? Wat moest je bestellen? En wanneer zou de klant het eerste deel betalen? Het zit in je hoofd, in Excel en in je mail."
      solution:
        title: "OfferDesk onthoudt het voor je"
        body: "Bij elke offerte staat hoe je hem hebt gemaakt: bij wie je inkoopt, voor welke prijs en wat je eraan overhoudt. Ook wanneer de klant wat betaalt staat er al in. Zegt de klant ja, dan krijgt hij meteen het verzoek om te betalen."
      difference:
        title: "Sneller je geld binnen"
        body: "De meeste programma's stoppen zodra de offerte de deur uit is. OfferDesk gaat door: bestellen, het werk, en een herinnering als de klant nog niet betaald heeft."
