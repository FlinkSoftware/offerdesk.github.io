  process:
    title_prefix: "From quote to payment"
    title_highlight: "without losing information"
    body: "OfferDesk does more than create a quote. Suppliers, purchase prices, margins, customer agreements and the payment schedule stay linked, from the first request until the money is in."
    steps:
      - "Calculate & quote"
      - "Approval & deposit"
      - "Purchasing & execution"
      - "Getting paid"
    cards:
      problem:
        title: "Four weeks later, the customer approves…"
        body: "Great news. But then the searching begins. Which supplier had you chosen? What margin had you calculated? What did you need to order? And when was the deposit due again? It is scattered across your head, Excel and email."
      solution:
        title: "OfferDesk remembers it for you"
        body: "Every quote keeps how it was built: suppliers, purchase prices and margins. The payment schedule is already in it, so the customer sees upfront what to pay when, and gets your payment request right after approving."
      difference:
        title: "Get paid sooner"
        body: "Most quoting software stops after sending a PDF. OfferDesk takes you further: from purchasing and execution to reminders for open instalments and the final payment coming in."

  features:
    title_prefix: "Everything you need for"
    title_highlight: "profitable quoting"
    intro: "From supplier and cost price to customer approval and purchasing. OfferDesk stores not only your quote, but also the knowledge behind it."
    sections:
      - eyebrow: "Margin control"
        title: "See what you earn on every line."
        body: "Every line knows its purchase price, margin and profit. Change the margin and the price follows at once, and the other way round. You know before you send whether it adds up."
        bullets:
          - "Purchase, margin and profit per line"
          - "Gross profit and margin of the whole quote"
          - "A line without a purchase? Save it as a product in one click"
        layout: "overlap"
        images:
          - src: "/images/offerdesk/crop-regels.webp"
            alt: "Quote lines with purchase price, supplier, margin and profit per line"
          - src: "/images/offerdesk/crop-winst.webp"
            alt: "Profitability of the quote: revenue, purchase costs and gross profit"

      - eyebrow: "Suppliers & products"
        title: "Never search for prices or suppliers again."
        body: "Record suppliers, products and purchase prices once, or import your wholesaler's price list. Every quote stays linked to the right supplier and price."
        bullets:
          - "Suppliers linked to products"
          - "Import your wholesaler's price list in one go"
          - "Always insight into the source of a price"
        images:
          - src: "/images/offerdesk/crop-producten.webp"
            alt: "The product catalogue with suppliers, purchase prices and margins"

      - eyebrow: "From acceptance to purchasing"
        title: "Know straight away what to order."
        body: "As soon as a customer accepts, the purchase list is ready: per supplier, with article numbers, quantities and purchase prices."
        bullets:
          - "Purchase list per supplier"
          - "No duplicate data entry"
          - "Faster from acceptance to execution"
        images:
          - src: "/images/offerdesk/crop-inkoop.webp"
            alt: "The purchase list of an accepted quote, per supplier"

      - eyebrow: "Payment schedule"
        title: "Let a deposit pre-finance your purchasing."
        body: "You order the materials, so let the customer pay for them upfront. OfferDesk knows which lines you buy in and works out the deposit for the materials itself. If the customer pulls out later, you are not left with the costs. Your customer only sees the amount, not your purchase prices. Per instalment they get a payment request with your own payment link, and OfferDesk reminds for you."
        bullets:
          - "A deposit for the materials, a percentage or a fixed amount; extra work goes to the remainder"
          - "Payment request right on acceptance, or accepting is paying the deposit"
          - "Automatic reminders, and you tick off what is paid"
        layout: "overlap"
        images:
          - src: "/images/offerdesk/crop-betalingen.webp"
            alt: "The payment schedule of a quote: deposit requested, remainder on delivery"
          - src: "/images/offerdesk/crop-klant-betaling.webp"
            alt: "What your customer sees: the terms and a button to pay"

      - eyebrow: "Design"
        title: "Quotes that fit your company."
        body: "Choose the design that suits you: classic and calm, modern with a striking header, or compact for long material lists. With your own logo, and adjustable per quote."
        bullets:
          - "Three designs for PDF, preview and customer page"
          - "Your own opening and closing text with placeholders"
          - "In Dutch or English, in your customer's language"
        layout: "row"
        images:
          - src: "/images/offerdesk/crop-template-classic.webp"
            alt: "A quote in the Classic design"
            caption: "Classic"
          - src: "/images/offerdesk/crop-template-modern.webp"
            alt: "A quote in the Modern design"
            caption: "Modern"
          - src: "/images/offerdesk/crop-template-compact.webp"
            alt: "A quote in the Compact design"
            caption: "Compact"

      - eyebrow: "Working together"
        title: "Everyone knows what is going on."
        body: "See who changed what in a quote, answer your customer's questions one by one, and give colleagues a task they see under My tasks."
        bullets:
          - "Full history of every change"
          - "Customer questions on the dashboard, with a notification"
          - "Tasks for colleagues, with an email"
        layout: "overlap"
        images:
          - src: "/images/offerdesk/crop-historie.webp"
            alt: "The history of a quote: changes, sending and payments"
          - src: "/images/offerdesk/crop-vraag.webp"
            alt: "A customer's question with the answer below it"

