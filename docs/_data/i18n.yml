  process:
    title_prefix: "Van offerte tot betaling"
    title_highlight: "zonder informatieverlies"
    body: "OfferDesk helpt je niet alleen een offerte te maken. Leveranciers, inkoopprijzen, marges, klantafspraken en het betaalschema blijven gekoppeld, van aanvraag tot het moment dat het geld binnen is."
    steps:
      - "Calculeren & offreren"
      - "Akkoord & aanbetaling"
      - "Inkoop & uitvoering"
      - "Betaald krijgen"
    cards:
      problem:
        title: "Vier weken later is de klant akkoord…"
        body: "Mooi nieuws. Maar dan begint het zoeken. Welke leverancier had je gekozen? Welke marge had je berekend? Wat moest je bestellen? En wanneer had je de aanbetaling ook alweer afgesproken? Het zit verspreid in je hoofd, Excel en e-mail."
      solution:
        title: "OfferDesk onthoudt het voor je"
        body: "Iedere offerte bewaart hoe hij is opgebouwd: leveranciers, inkoopprijzen en marges. Het betaalschema staat er al in, zodat de klant vooraf ziet wat hij wanneer betaalt en na akkoord meteen jouw betaalverzoek krijgt."
      difference:
        title: "Sneller je geld binnen"
        body: "De meeste offertesoftware stopt na het versturen van een PDF. OfferDesk helpt je verder: van inkoop en uitvoering tot herinneringen voor openstaande termijnen en de laatste betaling die binnen is."
  features:
    title_prefix: "Alles wat je nodig hebt voor"
    title_highlight: "grip op je marges"
    intro: "Van leverancier en kostprijs tot klantgoedkeuring en inkoop. OfferDesk bewaart niet alleen je offerte, maar ook alle keuzes erachter."
    sections:
      - eyebrow: "Grip op marge"
        title: "Zie per regel wat je verdient."
        body: "Elke regel kent zijn inkoopprijs, marge en winst. Pas je de marge aan, dan zie je de prijs meteen meebewegen, en andersom. Zo weet je voordat je verstuurt of je goed zit."
        bullets:
          - "Inkoop, marge en winst per regel"
          - "Brutowinst en marge van de hele offerte"
          - "Regel zonder inkoop? Sla hem in één klik op als product"
        layout: "overlap"
        images:
          - src: "/images/offerdesk/crop-regels.webp"
            alt: "Offerteregels met inkoopprijs, leverancier, marge en winst per regel"
          - src: "/images/offerdesk/crop-winst.webp"
            alt: "Winstgevendheid van de offerte: omzet, inkoopkosten en brutowinst"

      - eyebrow: "Leveranciers & producten"
        title: "Nooit meer zoeken naar prijzen of leveranciers."
        body: "Leg leveranciers, producten en inkoopprijzen één keer vast, of importeer de prijslijst van je groothandel. Iedere offerte blijft gekoppeld aan de juiste leverancier en prijs."
        bullets:
          - "Leveranciers gekoppeld aan producten"
          - "Prijslijst van je groothandel in één keer importeren"
          - "Altijd inzicht in de herkomst van een prijs"
        images:
          - src: "/images/offerdesk/crop-producten.webp"
            alt: "De productcatalogus met leveranciers, inkoopprijzen en marges"

      - eyebrow: "Van akkoord naar inkoop"
        title: "Weet direct wat je moet bestellen."
        body: "Zodra een klant akkoord geeft, staat de inkooplijst klaar: per leverancier, met artikelnummers, aantallen en inkoopprijzen."
        bullets:
          - "Inkooplijst per leverancier"
          - "Geen dubbel invoerwerk"
          - "Sneller van akkoord naar uitvoering"
        images:
          - src: "/images/offerdesk/crop-inkoop.webp"
            alt: "De inkooplijst van een geaccepteerde offerte, per leverancier"

      - eyebrow: "Betaalschema"
        title: "Laat je inkoop voorfinancieren door een aanbetaling."
        body: "Jij bestelt het materiaal, dus laat de klant dat vooraf betalen. OfferDesk weet welke regels je inkoopt en rekent de aanbetaling voor het materiaal zelf uit. Zegt de klant later af, dan zit jij niet met de kosten. Je klant ziet alleen het bedrag, niet je inkoopprijzen. Per termijn krijgt hij een betaalverzoek met jouw eigen betaallink, en OfferDesk herinnert voor je."
        bullets:
          - "Aanbetaling voor het materiaal, een percentage of een vast bedrag; meerwerk komt bij het restant"
          - "Betaalverzoek direct bij akkoord, of akkoord geven is aanbetalen"
          - "Automatische herinneringen, en jij vinkt af wat voldaan is"
        layout: "overlap"
        images:
          - src: "/images/offerdesk/crop-betalingen.webp"
            alt: "Het betaalschema van een offerte: aanbetaling gevraagd, restant bij oplevering"
          - src: "/images/offerdesk/crop-klant-betaling.webp"
            alt: "Wat je klant ziet: de termijnen en een knop om te betalen"

      - eyebrow: "Opmaak"
        title: "Offertes die bij je bedrijf passen."
        body: "Kies het ontwerp dat bij jou past: klassiek en rustig, modern met een opvallende kop, of compact voor lange materiaallijsten. Met je eigen logo, en per offerte aan te passen."
        bullets:
          - "Drie ontwerpen voor PDF, voorbeeld en klantpagina"
          - "Eigen opening- en slottekst met invulvelden"
          - "In het Nederlands of Engels, in de taal van je klant"
