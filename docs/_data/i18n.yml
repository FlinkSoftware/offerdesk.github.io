  process:
    title: "Herken je dit?"
    intro: "Vijf momenten uit een gewone werkweek."
    payoff:
      title: "Herken je er drie of meer?"
      text: "Dan is OfferDesk voor jou gemaakt: je weet wat je overhoudt, en wanneer je geld binnenkomt. Probeer het 14 dagen gratis, zonder te betalen."
      cta: "Start gratis"
    items:
      - lead: "Foto's gemaakt bij de klant. Maten op een briefje."
        questions: "Een week later: waar staan ze ook alweer? Telefoon, groepsapp, de bus?"
        answer: "Je zet ze bij de klus, vanaf je telefoon. Daar blijven ze."
      - lead: "Vier weken later zegt de klant ja."
        questions: "Welke groothandel was het? Wat verdien je eraan? Wat moet je bestellen? Wanneer betaalt hij?"
        answer: "Het staat allemaal bij de offerte. Je bestellijst staat klaar."
      - lead: "Voorwaarden meegestuurd, of niet?"
        questions: "En de handleiding van die ketel, en het blaadje van de garantie?"
        answer: "Ze gaan vanzelf mee. De klant vinkt af dat hij ze gelezen heeft."
      - lead: "Weet de klant dat hij eerst moet betalen?"
        questions: "Jij denkt van wel. Hij denkt: dat komt bij de factuur."
        answer: "Hij ziet het bij de offerte. Na zijn ja krijgt hij meteen jouw betaallink, en een herinnering als het uitblijft."
      - lead: "De klant belt. Jij staat op een dak."
        questions: "\"Kan die batterij ook in de garage?\" Wat was ook alweer de afspraak?"
        answer: "Hij stelt zijn vraag bij de offerte. Jij antwoordt als het uitkomt, en het antwoord blijft erbij staan."

