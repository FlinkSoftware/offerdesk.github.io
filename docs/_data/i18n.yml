  faq:
    title_prefix: ""
    title_highlight: "Veelgestelde"
    title_suffix: "vragen"
    items:
      - question: "Wat is OfferDesk en hoe verschilt het van gewone offertesoftware?"
        answer: "OfferDesk is project- en offertesoftware voor vakbedrijven die werk op offertebasis aannemen: aannemers, installateurs, schilders, elektriciens, hoveniers en onderhoudsbedrijven. Gewone offertesoftware is gericht op het document: een nette offerte met regels en een totaal. Wat de klus je kost en wat je eraan overhoudt, reken je ergens anders uit. OfferDesk rekent mee: achter elke regel staat een inkoopprijs en een marge, dus je ziet tijdens het maken de verwachte marge van het hele project. Leveranciers en prijzen sla je eenmalig op, en na akkoord van de klant staat de materiaallijst per leverancier klaar. Gewone software helpt je een offerte te schrijven; OfferDesk helpt je een winstgevende offerte te schrijven en die ook winstgevend uit te voeren."
      - question: "Is OfferDesk een alternatief voor een zwaar ERP-systeem?"
        answer: "Voor het stuk van calculatie tot inkoop wel; als volledig ERP niet, en dat is bewust. Een ERP zoals SAP, AFAS of Exact dekt het hele bedrijf (financiën, voorraad, productie, HR) en vraagt een implementatietraject, consultants en training. OfferDesk pakt het deel waar projectbedrijven geld verdienen of verliezen: de kostprijs vooraf, de marge tijdens het offreren en de inkoop na akkoord. Je begint dezelfde dag, betaalt een vast bedrag per maand en kunt maandelijks opzeggen. Je boekhouding blijft in je eigen pakket, met een koppeling naar Moneybird. Heb je voorraadbeheer over meerdere locaties, productieplanning of HR nodig, dan hoort een ERP bij je. Wil je weten wat een klus kost, wat je eraan verdient en wat je moet inkopen, dan is OfferDesk de lichtere en snellere keuze."
      - question: "Hoe helpt OfferDesk bij de stap van offerte naar inkoop en uitvoering?"
        answer: "De inkoop zit al in de offerte. Tijdens het offreren koppel je elke materiaalregel aan een product uit je catalogus, met leverancier, artikelnummer en inkoopprijs. Bij akkoord keurt de klant de offerte goed via een beveiligde link; dat akkoord en de vragen die hij stelde staan vast in de historie. Daarna staat de materiaallijst klaar, per leverancier, met de aantallen en prijzen uit de offerte, zodat je direct bestelt tegen de prijs waarmee je hebt gerekend. Voor de uitvoering houd je per offerte taken en historie bij, en met een betaalschema vraag je een aanbetaling bij akkoord en de rest bij oplevering, met automatische herinneringen. Zo is de marge die je vooraf berekende ook de marge waarmee je inkoopt en uitvoert."
      - question: "Waar begin ik als ik een offerte maak?"
        answer: "Vul eerst je productcatalogus met materialen, diensten en standaardprijzen. Voeg deze vervolgens toe aan je offerte, pas aantallen en marges aan en zie direct wat je naar verwachting verdient. Verstuur de offerte online of als PDF en volg daarna eenvoudig de status."

      - question: "Ik maak een offerte en vergeet later welke leverancier ik wilde gebruiken. Hoe helpt OfferDesk?"
        answer: "OfferDesk onthoudt het voor je. Je slaat leveranciers eenmalig op met contactgegevens, minimale afnames, SKU's en inkoopprijzen. Elk product blijft gekoppeld aan de juiste leverancier. Open je de offerte later opnieuw, dan zie je direct welke leverancier, producten, prijzen en marges zijn gebruikt."

      - question: "Hoeveel offertes kan ik maken?"
        answer: "Met Professional en Business maak je onbeperkt offertes. Starter is bedoeld voor zzp'ers die professioneel willen offreren. Bekijk de verschillende plannen onder Prijzen."

      - question: "Kan ik mijn eigen logo en huisstijl gebruiken?"
        answer: "Ja. Je offertes worden gegenereerd met professionele templates in jouw bedrijfslogo en huisstijl, zodat iedere offerte herkenbaar bij jouw bedrijf past."

      - question: "Stopt OfferDesk na het versturen van de offerte?"
        answer: "Nee. Klanten kunnen online akkoord geven en feedback achterlaten. Daarna helpt OfferDesk je verder met materiaalinkoop en voorbereiding. Functionaliteiten voor planning, voorraadbeheer, facturatie en winstmeting staan op de roadmap."

      - question: "Voor wie is OfferDesk bedoeld?"
        answer: "Voor het brede MKB dat snelle grip wil op offertes, verwachte marges en inkoop. Denk aan aannemers, HVAC- en CV-installateurs, elektriciens, loodgieters, schilders, afbouwbedrijven, hoveniers, zonnepaneel-installateurs, onderhoudsbedrijven en andere vakbedrijven met medewerkers in het veld. OfferDesk is het toegankelijke, snelle alternatief voor ingewikkelde ERP-software."
      - question: "Hoe ziet mijn klant de offerte?"
        answer: "Je klant krijgt een e-mail met de PDF en een link met een toegangscode. Op die pagina bekijkt hij de offerte, downloadt hem, stelt vragen en geeft met zijn naam akkoord. Jij krijgt daarvan een melding, en ziet alles terug bij de offerte. Vooraf kun je zelf bekijken wat je klant te zien krijgt."
      - question: "Ik heb al een boekhoudpakket. Kan ik mijn facturen daar blijven maken?"
        answer: "Ja, en dat is ook de bedoeling. OfferDesk maakt offertes, geen facturen: je facturen en je administratie blijven in je eigen boekhoudpakket. Werk je met Moneybird, dan zet OfferDesk een geaccepteerde offerte er met één klik in. Met een ander pakket neem je de geaccepteerde offerte over; koppelingen met Exact Online, SnelStart en e-Boekhouden.nl staan op de roadmap."
      - question: "Kan ik OfferDesk koppelen met Moneybird?"
        answer: "Ja, in elk abonnement. Je koppelt je Moneybird-administratie bij Instellingen › Koppelingen. Daarna maak je van een geaccepteerde offerte met één klik een conceptfactuur in Moneybird, met je klant als contact en de btw per regel. In Moneybird controleer en verstuur je de factuur zelf."
      - question: "Hoe betaal ik voor OfferDesk?"
        answer: "Veilig via Mollie, met iDEAL, creditcard of automatische incasso. Je probeert OfferDesk eerst 14 dagen gratis en kiest zelf of je direct betaalt of pas na de proefperiode. Maandelijks opzegbaar."
      - question: "Kan ik een aanbetaling vragen?"
        answer: "Ja, met een betaalschema (Professional en Business): bijvoorbeeld het materiaal bij akkoord en het restant bij oplevering. OfferDesk rekent de aanbetaling voor het materiaal zelf uit uit de regels die je bij leveranciers inkoopt, zonder je eigen werk; je klant ziet alleen het bedrag. Een percentage of vast bedrag kan ook. Je klant krijgt per termijn een betaalverzoek met de betaallink van je eigen bank, Tikkie of bunq.me; het geld komt rechtstreeks bij jou binnen. OfferDesk herinnert de klant, en jij vinkt af wat betaald is."
      - question: "Wat als ik met een klant afwijkende betaaltermijnen afspreek?"
        answer: "Dat kan per offerte. Je standaardschema is alleen een startpunt: per offerte kies je zelf de termijnen, als percentage of vast bedrag, te betalen bij akkoord, bij de start van het werk, bij oplevering of op een vaste datum. De klant ziet de afspraken vooraf op de offerte, en meerwerk komt bij de laatste termijn. Betaalschema's zitten in Professional en Business."
      - question: "Kan ik foto's en documenten bij een offerte bewaren?"
        answer: "Ja, in elk abonnement. Op het tabblad Bestanden zet je foto's (ook direct vanaf je telefooncamera), maten, schetsen en PDF's bij de offerte, met een beschrijving. Ze zijn voor je team, tenzij je een bestand zichtbaar maakt voor de klant: dan staat het als bijlage op de offertepagina. Foto's worden automatisch verkleind, zodat je opslag lang meegaat."
      - question: "Kan mijn klant mijn algemene voorwaarden zien?"
        answer: "Ja. Je uploadt je algemene voorwaarden als PDF bij Instellingen › Algemene voorwaarden. Elke offerte die je verstuurt, krijgt de versie die op dat moment geldt: je klant leest die op de offertepagina en vinkt bij het accepteren aan dat hij ermee akkoord gaat. OfferDesk legt vast welke versie dat was en wanneer. Pas je je voorwaarden later aan, dan houden offertes die al verstuurd zijn hun eigen versie. In elk abonnement."
      - question: "Kan ik kiezen hoe mijn offerte eruitziet?"
        answer: "Ja. Je offerte krijgt je eigen logo en je eigen teksten boven en onder de regels. In Professional en Business kies je uit drie ontwerpen: Klassiek, Modern en Compact, standaard of per offerte."

