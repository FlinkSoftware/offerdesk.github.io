  process:
    title: "Sound familiar?"
    intro: "Five moments from an ordinary working week."
    payoff:
      title: "Recognise three or more?"
      text: "Then OfferDesk was made for you: you know what you keep, and when your money comes in. Try it free for 14 days, without paying."
      cta: "Start for free"
    items:
      - lead: "Photos taken at the customer. Measurements on a note."
        questions: "A week later: where are they again? Phone, group chat, the van?"
        answer: "You put them with the job, from your phone. That is where they stay."
      - lead: "Four weeks later the customer says yes."
        questions: "Which wholesaler was it? What do you make on it? What do you order? When does he pay?"
        answer: "It is all on the quote. Your order list is ready."
      - lead: "Terms sent along, or not?"
        questions: "And the manual for that boiler, and the warranty leaflet?"
        answer: "They go along by themselves. The customer ticks that he has read them."
      - lead: "Does the customer know he pays first?"
        questions: "You think so. He thinks: that comes with the invoice."
        answer: "He sees it on the quote. After his yes he gets your payment link right away, and a reminder if it stays out."
      - lead: "The customer calls. You are on a roof."
        questions: "\"Can that battery go in the garage?\" What was the agreement again?"
        answer: "He asks on the quote itself. You answer when it suits you, and the answer stays there."

