        body: "You quote based on supplier prices you have to look up. Two days later you forget which supplier you wanted to order from, what margin you used, or what the minimum order quantity was. Calculation mistakes cost profit. Customers take weeks to approve quotes. Nobody remembers what was agreed."
      solution:
        title: "The solution"
        body: "OfferDesk stores your suppliers, products, prices and margins once. With each quote: select product, price and margin calculate automatically. Everything stays traceable and linked to your suppliers."
      difference:
        title: "The difference"
        body: "Other pre-sales software stops after the PDF. OfferDesk remembers everything: supplier info, margins, customer approvals, and auto-generates a purchase list grouped by supplier."
  features:
    title_prefix: "Features"
    title_highlight: "you actually want to use"
    intro: "Everything you need to quote professionally — and then deliver the job profitably."
    sections:
      - eyebrow: "Quote & margin calculator"
        title: "Store supplier costs. Quote faster."
        body: "Store your suppliers and products once with price, margin, and minimum order quantities. Then click in a quote 'Add from catalog,' and price + margin auto-fill. Instead of 15 minutes texting suppliers: 15 seconds in OfferDesk."
        bullets:
          - "Supplier info (name, contact, minimum order, SKUs) entered once"
          - "Click product → price and margin fill automatically"
          - "No Excel, no lookups, no errors"
        cta_label: "Interested in this feature?"
        cta: "Sign up"
        image_alt: "OfferDesk: supplier info stored, prices calculate automatically"
      - eyebrow: "Margin calculator"
        title: "Forgot what margin you used after 2 days?"
        body: "OfferDesk remembers everything: your suppliers, costs, margins, and minimum orders. Every quote shows exactly: supplier cost → margin % → your profit. No surprise after the job."
        bullets:
          - "For each line: supplier cost, your margin %, profit per unit, total"
