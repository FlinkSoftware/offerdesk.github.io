      - question: "I create a quote and later forget which supplier I intended to use. How does OfferDesk help?"
        answer: "OfferDesk remembers it for you. Store suppliers once with their contact details, minimum order quantities, SKUs, and purchase prices. Every product remains linked to the correct supplier. When you reopen the quote later, you can immediately see which suppliers, products, prices, and margins were used."

      - question: "How many quotes can I create?"
        answer: "Professional and Business include unlimited quotes. Starter is intended for solo operators who want to quote professionally. View the available plans under Pricing."

      - question: "Can I use my own logo and branding?"
        answer: "Yes. Quotes are generated using professional templates with your company logo and branding, so every quote has a consistent appearance that matches your business."

      - question: "Does OfferDesk stop after sending the quote?"
