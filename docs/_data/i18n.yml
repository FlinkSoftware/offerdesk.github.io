    title_prefix: "What is"
    title_highlight: "OfferDesk"
    paragraphs:
      - "OfferDesk is the application for service companies that want to work from quote to execution without fragmented tools. Enter products once and build a complete quote in minutes, including purchasing, sales, and margin."
      - "Most quoting software stops after sending a PDF. OfferDesk keeps going: customers approve online, you prepare the job, and you keep control of profit."
      - "Our vision: the operating system for service companies — from <strong>quote → materials → job → profit</strong>."
