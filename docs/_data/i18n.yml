  process:
    title_prefix: "From quote to payment"
    title_highlight: "without the hassle"
    body: "With OfferDesk you do more than make the quote. You also see what you earn, what to order and when the customer pays. It all stays together, from the customer's first question to the money in your account."
    steps:
      - "Make the quote"
      - "Customer says yes"
      - "Order and get to work"
      - "Money in"
    cards:
      problem:
        title: "Four weeks later, the customer approves…"
        body: "Great. But then the searching begins. Which wholesaler was it? What would you earn on it? What did you need to order? And when would the customer pay the first part? It is in your head, in Excel and in your email."
      solution:
        title: "OfferDesk remembers it for you"
        body: "Every quote keeps how you made it: where you buy, at what price and what you keep. When the customer pays what is in it too. When the customer says yes, they get the request to pay straight away."
      difference:
        title: "Get paid sooner"
        body: "Most programs stop once the quote is out of the door. OfferDesk keeps going: ordering, the work, and a reminder when the customer has not paid yet."

