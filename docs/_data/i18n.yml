  faq:
    title_prefix: ""
    title_highlight: "Veelgestelde"
    title_suffix: "vragen"
    items:
      - question: "Wat is OfferDesk, en wat is anders dan bij gewone offertesoftware?"
        answer: "OfferDesk is voor vakbedrijven die werk aannemen op offerte: aannemers, installateurs, schilders, elektriciens, hoveniers, onderhoud. Gewone offertesoftware maakt een net document. Wat de klus je kost en wat je eraan overhoudt, reken je ergens anders uit. OfferDesk rekent mee: bij elke regel staat wat je inkoopt en wat je overhoudt. Je groothandels en prijzen zet je er één keer in, en zegt de klant ja, dan staat je bestellijst klaar."
      - question: "Is OfferDesk zo'n zwaar systeem als SAP of AFAS?"
        answer: "Nee, en dat is bewust. Zulke systemen doen het hele bedrijf: boekhouding, voorraad, personeel. Dat kost maanden en consultants. OfferDesk doet het stuk waar je geld verdient of verliest: wat de klus kost, wat je overhoudt, en wat je moet bestellen als de klant ja zegt. Je begint vandaag, betaalt een vast bedrag per maand en kunt elke maand stoppen. Je boekhouding blijft waar hij is."
      - question: "Wat gebeurt er als de klant ja zegt?"
        answer: "Dan staat je bestellijst klaar, per groothandel, met de aantallen en prijzen uit de offerte. Heb je een aanbetaling afgesproken, dan krijgt de klant meteen het betaalverzoek. En alles wat er daarna gebeurt, wie wat deed, welke vraag de klant stelde, staat bij de offerte."
        home: true
      - question: "Waar begin ik?"
        answer: "Zet eerst je materiaal en je uren erin, met je inkoopprijzen. Dan maak je je eerste offerte: regels kiezen, aantallen aanpassen, en je ziet meteen wat je overhoudt. Versturen kan online of als PDF. Begin je met de voorbeelddata, dan staat er al een klant en een offerte om mee te spelen."
        home: true
      - question: "Ik weet later niet meer bij welke groothandel ik wilde kopen. Helpt OfferDesk daarbij?"
        answer: "Ja. Bij elk product staat de groothandel, het artikelnummer en je inkoopprijs. Open je de offerte over een maand, dan zie je precies waar je het wilde halen, voor welke prijs, en wat je eraan overhoudt."
      - question: "Hoeveel offertes kan ik maken?"
        answer: "Zoveel je wilt, in elk pakket. Starter is voor wie alleen werkt, Professional voor een bedrijf met een paar man, Business voor een ploeg. Zie Prijzen."
      - question: "Kan ik mijn eigen logo gebruiken?"
        answer: "Ja. Je offertes krijgen je eigen logo en je eigen teksten, zodat elke offerte eruitziet als die van jouw bedrijf."
      - question: "Stopt OfferDesk als de offerte de deur uit is?"
        answer: "Nee. De klant zegt ja of stelt een vraag, jij ziet het meteen. Daarna helpt OfferDesk met de aanbetaling en de bestellijst. Planning, voorraad en nacalculatie komen eraan."
      - question: "Voor wie is OfferDesk?"
        answer: "Voor vakmensen die werk aannemen op offerte: aannemers, cv- en warmtepompinstallateurs, elektriciens, loodgieters, zonnepanelenleggers, schilders, stukadoors, hoveniers, onderhoudsbedrijven. Van één man met een bus tot een ploeg van vijf."
      - question: "Hoe ziet mijn klant de offerte?"
        answer: "Hij krijgt een mail met de PDF en een link met een code. Op die pagina leest hij de offerte, pakt de PDF, stelt een vraag en zegt ja met zijn naam. Jij krijgt een melding en ziet alles terug bij de offerte. Je kunt vooraf zelf kijken wat hij te zien krijgt."
        home: true
      - question: "Ik heb al een boekhoudpakket. Blijf ik mijn facturen daar maken?"
        answer: "Ja, zo is het bedoeld. OfferDesk maakt offertes, geen facturen. Werk je met Moneybird, dan zet je een offerte waar de klant ja op zei met één tik als factuur in Moneybird. Met een ander pakket neem je de offerte over; Exact Online, SnelStart en e-Boekhouden.nl komen eraan."
        home: true
      - question: "Werkt het met Moneybird?"
        answer: "Ja, in elk pakket. Je koppelt Moneybird bij Instellingen › Koppelingen. Daarna zet je een offerte waar de klant ja op zei met één tik als conceptfactuur in Moneybird, met de klant als contact en de btw per regel. In Moneybird kijk je hem na en verstuur je hem."
      - question: "Hoe betaal ik voor OfferDesk?"
        answer: "Via Mollie, met iDEAL, creditcard of automatische incasso. Je probeert het eerst 14 dagen gratis en kiest dan zelf: meteen betalen of pas na de proefperiode. Elke maand opzegbaar."
        home: true
      - question: "Kan ik een aanbetaling vragen?"
        answer: "Ja (Professional en Business). Bijvoorbeeld het materiaal bij ja en de rest bij oplevering. OfferDesk rekent de aanbetaling voor het materiaal zelf uit, zonder je eigen uren; de klant ziet alleen het bedrag. Een deel of een vast bedrag kan ook. De klant krijgt een betaalverzoek met de betaallink van je eigen bank, Tikkie of bunq; het geld komt rechtstreeks bij jou. OfferDesk herinnert hem eraan, jij vinkt af wat binnen is."
        home: true
      - question: "En als ik met een klant iets anders afspreek over betalen?"
        answer: "Dat kan per offerte. Je vaste verdeling is een beginpunt: per offerte kies je de delen, als percentage of vast bedrag, te betalen bij ja, bij de start, bij oplevering of op een datum. De klant ziet het vooraf op de offerte, en meerwerk komt bij de laatste betaling. Professional en Business."
      - question: "Kan ik foto's en papieren bij een offerte bewaren?"
        answer: "Ja, in elk pakket. Op het tabblad Foto's zet je foto's (ook rechtstreeks vanaf je telefoon), maten, schetsen en PDF's bij de offerte, met een korte tekst. Ze zijn voor je eigen mensen, tenzij je er een voor de klant zichtbaar maakt: dan staat hij bij de offerte. Foto's worden vanzelf kleiner gemaakt, zodat je ruimte lang meegaat."
        home: true
      - question: "Ziet mijn klant mijn voorwaarden?"
        answer: "Ja. Je zet je voorwaarden als PDF bij Instellingen › Algemene voorwaarden. Elke offerte die je verstuurt krijgt de versie van dat moment; de klant leest ze op de offertepagina en vinkt aan dat hij ermee akkoord gaat. OfferDesk legt vast welke versie dat was en wanneer. Pas je ze later aan, dan houden oude offertes hun eigen versie. In elk pakket."
        home: true
      - question: "Kan ik kiezen hoe mijn offerte eruitziet?"
        answer: "Ja. Je offerte krijgt je eigen logo en je eigen tekst boven en onder de regels. In Professional en Business kies je uit drie opmaken: Klassiek, Modern en Compact, voor alles of per offerte."
