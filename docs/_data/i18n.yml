          - "Customers can leave comments directly in the quote"
          - "You see real-time status and feedback — no 'did you get that?'"
        cta_label: "Interested in this feature?"
        cta: "Sign up"
        image_alt: "OfferDesk online portal: customers see, review, provide feedback"
