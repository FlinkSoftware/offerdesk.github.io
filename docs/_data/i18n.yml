      - question: "Where do I start when creating a quote?"
        answer: "First fill your product catalog: materials, services, and standard prices. Then drag those items into the quote builder, add labor and travel costs, and see your margin instantly. Send it as a PDF or through the approval portal."
      - question: "I create a quote, and 2 days later I forget which supplier I wanted to order from. How does OfferDesk help?"
        answer: "OfferDesk remembers everything. You store your suppliers once with contact details, minimum orders, SKU's, and purchase costs. Each product is linked to that supplier. Click on that same quote later? You see exactly: where you wanted to buy it, what margin you used, what the minimum order was."
      - question: "How many quotes can I create?"
        answer: "Professional and Business let you create unlimited quotes. Starter is for solo operators who send basic quotes. See the plans under Pricing."
      - question: "Can I use my own logo and branding?"
        answer: "Yes. PDF quotes use professional templates with your company logo and branding so they look like they come from your business."
      - question: "Does OfferDesk stop after sending the PDF?"
        answer: "No. Customers approve online, you track the status, and after approval OfferDesk helps with materials, preparation, and — soon — scheduling, invoicing, and profit tracking."
