  faq:
    title_prefix: "Frequently"
    title_highlight: "asked"
    title_suffix: "questions"
    items:
      - question: "Where do I start when creating a quote?"
        answer: "First, fill your product catalog with materials, services, and standard prices. Then add these to your quote, adjust quantities and margins, and immediately see what you are expected to earn. Send the quote online or as a PDF and easily track its status afterward."

      - question: "I create a quote and later forget which supplier I intended to use. How does OfferDesk help?"
        answer: "OfferDesk remembers it for you. Store suppliers once with contact details, minimum order quantities, SKUs, and purchase prices. Every product remains linked to the correct supplier. When you reopen the quote later, you can immediately see which supplier, products, prices, and margins were used."

      - question: "How many quotes can I create?"
        answer: "With Professional and Business, you can create unlimited quotes. Starter is intended for sole traders who want to quote professionally. View the different plans under Pricing."

      - question: "Can I use my own logo and corporate design?"
        answer: "Yes. Your quotes are generated using professional templates in your company logo and house style, ensuring every quote recognizably fits your business."

      - question: "Does OfferDesk stop after sending the quote?"
        answer: "No. Customers can approve online and leave feedback. After that, OfferDesk helps you further with material purchasing and preparation. Features for scheduling, inventory management, invoicing, and profit measurement are on the roadmap."

      - question: "Who is OfferDesk for?"
        answer: "For trade businesses that create quotes based on materials, suppliers, and margins, such as flooring companies, HVAC and heating installers, electricians, plumbers, painters, maintenance companies, and other businesses with field teams."
      - question: "How does my customer see the quote?"
        answer: "Your customer gets an email with the PDF and a link with an access code. On that page they view the quote, download it, ask questions and accept it with their name. You get a notification and see it all on the quote. You can preview what your customer will see beforehand."
      - question: "I already use accounting software. Can I keep making my invoices there?"
        answer: "Yes, that is the idea. OfferDesk makes quotes, not invoices: your invoices and bookkeeping stay in your own accounting software. If you use Moneybird, OfferDesk puts an accepted quote into it in one click. With other software you copy over the accepted quote; integrations with Exact Online, SnelStart and e-Boekhouden.nl are on the roadmap."
      - question: "Can I connect OfferDesk to Moneybird?"
        answer: "Yes, on every plan. You connect your Moneybird administration under Settings › Integrations. After that, an accepted quote becomes a draft invoice in Moneybird in one click, with your customer as a contact and the VAT per line. You check and send the invoice yourself in Moneybird."
      - question: "How do I pay for OfferDesk?"
        answer: "Securely through Mollie, by iDEAL, credit card or direct debit. You try OfferDesk free for 14 days first and choose whether to pay right away or after the trial. Cancel monthly."
      - question: "Can I ask for a deposit?"
        answer: "Yes, with a payment schedule (Professional and Business): e.g. the materials on acceptance and the remainder on delivery. OfferDesk works out the materials deposit itself from the lines you buy from suppliers, without your own work; your customer only sees the amount. A percentage or fixed amount works too. Your customer gets a payment request per term with your own bank's, Tikkie's or bunq.me payment link; the money goes straight to you. OfferDesk reminds the customer, and you tick off what is paid."
      - question: "What if I agree different payment terms with a customer?"
        answer: "You set them per quote. Your standard schedule is only a starting point: per quote you choose the instalments yourself, as a percentage or a fixed amount, due on approval, at the start of the work, on delivery or on a fixed date. The customer sees the agreement upfront on the quote, and extra work goes into the last instalment. Payment schedules are part of Professional and Business."
      - question: "Can I choose how my quote looks?"
        answer: "Yes. Your quote gets your own logo and your own texts above and below the lines. In Professional and Business you choose from three designs: Classic, Modern and Compact, as a standard or per quote."

